<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto IG to Worker API</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
        }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 14px; font-weight: 500; color: #555; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .result-box a {
            color: #155724;
            font-weight: bold;
            text-decoration: none;
        }
        .error { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-top: 15px; display: none; font-size: 14px;}
    </style>
</head>
<body>

<div class="container">
    <h2>Auto IG Uploader</h2>
    <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Paste an Instagram Reel URL to automatically fetch and upload it to your Worker API.</p>
    
    <input type="url" id="igInput" class="input-field" placeholder="https://www.instagram.com/reel/..." />
    <button id="processBtn">Process & Upload</button>
    
    <div id="statusText" class="status"></div>
    
    <div id="resultBox" class="result-box">
        <p><strong>Success! Final URL:</strong></p>
        <a id="finalLink" href="#" target="_blank">Link will appear here</a>
    </div>
    
    <div id="errorBox" class="error"></div>
</div>

<script>
    const IG_API_BASE = "https://instagramdl.the-zake.workers.dev/?url=";
    const UPLOAD_API_URL = "https://file-host.itz-dev.workers.dev/upload";
    
    const igInput = document.getElementById('igInput');
    const processBtn = document.getElementById('processBtn');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const finalLink = document.getElementById('finalLink');
    const errorBox = document.getElementById('errorBox');

    function updateStatus(msg) {
        statusText.textContent = msg;
        console.log(msg);
    }

    function showError(msg) {
        statusText.textContent = "";
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        processBtn.disabled = false;
        processBtn.textContent = "Process & Upload";
    }

    processBtn.addEventListener('click', async () => {
        const url = igInput.value.trim();
        if (!url) return showError("Please paste an Instagram URL.");

        // Reset UI
        errorBox.style.display = "none";
        resultBox.style.display = "none";
        processBtn.disabled = true;

        try {
            // STEP 1: Get Instagram MP4 URL from your scraper
            updateStatus("Step 1: Fetching Reel data...");
            const igRes = await fetch(IG_API_BASE + encodeURIComponent(url));
            const igData = await igRes.json();

            if (!igData.success || !igData.data || !igData.data.medias) {
                throw new Error("Failed to extract data from Instagram link.");
            }

            const videoMedia = igData.data.medias.find(m => m.type === 'video' && m.extension === 'mp4');
            if (!videoMedia || !videoMedia.url) {
                throw new Error("No MP4 video found in this Reel.");
            }
            const mp4Url = videoMedia.url;

            // STEP 2: Download the MP4 into the browser as a Blob
            updateStatus("Step 2: Downloading video from Instagram...");
            const videoRes = await fetch(mp4Url);
            if (!videoRes.ok) throw new Error("Failed to download video blob (CORS or network issue).");
            const videoBlob = await videoRes.blob();

            // STEP 3: Upload the Blob to your Worker API
            updateStatus("Step 3: Uploading to Worker API...");
            const formData = new FormData();
            formData.append("files[]", videoBlob, "reels.mp4");
            formData.append("expiry", "-1");

            const uploadRes = await fetch(UPLOAD_API_URL, {
                method: "POST",
                body: formData
            });
            const uploadData = await uploadRes.json();

            if (!uploadData.success || !uploadData.files || uploadData.files.length === 0) {
                throw new Error("Worker API rejected the upload.");
            }

            // STEP 4: Display Final URL
            updateStatus("");
            const finalUrl = uploadData.files[0].url;
            finalLink.href = finalUrl;
            finalLink.textContent = finalUrl;
            resultBox.style.display = "block";
            
            processBtn.disabled = false;
            processBtn.textContent = "Process Another";

        } catch (error) {
            console.error(error);
            showError(error.message || "An unexpected error occurred.");
        }
    });
</script>

</body>
</html>
